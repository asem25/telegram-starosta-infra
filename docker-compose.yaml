name: starosta-backend

networks:
  appnet:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 160m
    command:
      - postgres
      - -c
      - shared_buffers=32MB
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
      - -c
      - max_connections=10
    env_file:
      - ${PROD_ENV_FILE:-prod.env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          PGPASSWORD="$${POSTGRES_PASSWORD}"
          psql -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
          -tAc 'SELECT 1' | grep -qx 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - appnet

  backend:
    image: "${BACKEND_IMAGE:-ghcr.io/example/telegram-bot-starosta-backend}:${BACK_TAG:-latest}"
    pull_policy: always
    restart: unless-stopped
    mem_limit: 360m
    env_file:
      - ${PROD_ENV_FILE:-prod.env}
    environment:
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseSerialGC
        -Xms64m
        -Xmx160m
        -Xss256k
        -XX:MaxMetaspaceSize=96m
        -XX:ReservedCodeCacheSize=24m
        -XX:MaxDirectMemorySize=16m
        -XX:+ClassUnloading
        -XX:+ExitOnOutOfMemoryError
        -Dspring.jmx.enabled=false
        -Dspring.main.lazy-initialization=true
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/${POSTGRES_DB}"
      SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
      SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: "1"
      SERVER_TOMCAT_THREADS_MAX: "10"
    ports:
      - "${BACKEND_BIND_ADDRESS:-0.0.0.0}:${BACKEND_PORT:-8081}:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8081/api/v1/check || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 20m
    networks:
      - appnet

volumes:
  pgdata:
