name: infra-ci

on:
  push:
    branches: [master]
    paths:
      - docker-compose.yaml
      - docker-compose.mini-app.yaml
      - deploy.sh
      - deploy-mini-app.sh
      - prod.backend.env.example
      - prod.mini-app.env.example
      - .github/workflows/auto-deploy-compose.yaml
  workflow_dispatch:

env:
  DEFAULT_DEPLOY_PATH: /ru/asem/bot/telegram-starosta-infra

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate backend compose
        run: PROD_ENV_FILE=prod.backend.env.example docker compose --env-file prod.backend.env.example -f docker-compose.yaml config --quiet

      - name: Validate mini-app compose
        run: PROD_ENV_FILE=prod.mini-app.env.example docker compose --env-file prod.mini-app.env.example -f docker-compose.mini-app.yaml config --quiet

      - name: Validate deploy scripts
        run: bash -n deploy.sh deploy-mini-app.sh

  provision-backend:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload backend deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USER }}
          key: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
          source: docker-compose.yaml,deploy.sh,prod.backend.env.example
          target: ${{ vars.BACKEND_DEPLOY_PATH || env.DEFAULT_DEPLOY_PATH }}
          overwrite: true

      - name: Verify backend server configuration
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.BACKEND_DEPLOY_PATH || env.DEFAULT_DEPLOY_PATH }}
        with:
          host: ${{ secrets.BACKEND_SERVER_HOST }}
          username: ${{ secrets.BACKEND_SERVER_USER }}
          key: ${{ secrets.BACKEND_SERVER_SSH_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            chmod +x deploy.sh
            test -s prod.env

  provision-mini-app:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload mini-app deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.MINI_APP_SERVER_HOST }}
          username: ${{ secrets.MINI_APP_SERVER_USER }}
          key: ${{ secrets.MINI_APP_SERVER_SSH_KEY }}
          source: docker-compose.mini-app.yaml,deploy-mini-app.sh,prod.mini-app.env.example
          target: ${{ vars.MINI_APP_DEPLOY_PATH || env.DEFAULT_DEPLOY_PATH }}
          overwrite: true

      - name: Verify mini-app server configuration
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ vars.MINI_APP_DEPLOY_PATH || env.DEFAULT_DEPLOY_PATH }}
        with:
          host: ${{ secrets.MINI_APP_SERVER_HOST }}
          username: ${{ secrets.MINI_APP_SERVER_USER }}
          key: ${{ secrets.MINI_APP_SERVER_SSH_KEY }}
          envs: DEPLOY_PATH
          script: |
            set -eu
            cd "$DEPLOY_PATH"
            chmod +x deploy-mini-app.sh
            test -s prod.env
